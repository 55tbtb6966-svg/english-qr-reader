<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>English QR Reader IndexedDB</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin:0; background:#f5f6f8; color:#111; }
    main { max-width:920px; margin:0 auto; padding:18px; }
    h1 { font-size:1.65rem; margin:4px 0 14px; }
    h2 { font-size:1.15rem; margin-top:0; }
    .card { background:#fff; border-radius:18px; padding:18px; margin-bottom:16px;
      box-shadow:0 4px 18px rgba(0,0,0,.07); }
    button, select, input, textarea {
      font:inherit; border-radius:12px; border:1px solid #c9cdd4; box-sizing:border-box;
    }
    button { padding:12px 14px; background:#111; color:#fff; border:0; font-weight:700; }
    button.secondary { background:#e9edf3; color:#111; }
    button.danger { background:#8b1e1e; }
    button:disabled { opacity:.5; }
    input[type="file"], input[type="text"], input[type="number"], textarea, select {
      width:100%; padding:11px; background:#fff;
    }
    textarea { min-height:82px; resize:vertical; }
    label { display:block; font-weight:650; }
    label span { display:block; margin-bottom:5px; }
    .grid2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .grid3 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
    .row > * { flex:1 1 140px; }
    .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
    .tabBtn { background:#e9edf3; color:#111; }
    .tabBtn.active { background:#111; color:#fff; }
    .panel { display:none; }
    .panel.active { display:block; }
    .hint { color:#666; font-size:.92rem; line-height:1.55; }
    .status { min-height:1.4em; font-weight:600; }
    .ok { color:#285; }
    .error { color:#a21b1b; }
    .badge { display:inline-block; padding:5px 9px; border-radius:999px; background:#e9edf3;
      font-size:.85rem; margin:0 6px 8px 0; }
    #english { font-size:clamp(1.8rem,7vw,3.4rem); font-weight:800; line-height:1.2;
      overflow-wrap:anywhere; margin:8px 0; }
    #japanese { font-size:1.2rem; color:#555; margin-top:10px; }
    #reader { width:100%; overflow:hidden; border-radius:14px; }
    .tableWrap { overflow-x:auto; margin-top:12px; }
    table { width:100%; border-collapse:collapse; min-width:860px; }
    th,td { border-bottom:1px solid #ddd; padding:9px 7px; text-align:left; vertical-align:top; }
    th { background:#f1f3f6; }
    .smallBtn { padding:7px 9px; font-size:.88rem; }
    .qrSheet { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-top:16px; }
    .qrCard { border:1px solid #ccc; border-radius:14px; padding:12px; text-align:center; break-inside:avoid; }
    .qrCard canvas,.qrCard img { width:150px!important; height:150px!important; }
    .qrId { font-weight:800; margin-top:7px; }
    .qrEnglish { margin-top:4px; }
    .qrJapanese { font-size:.9rem; color:#555; margin-top:2px; }
    .metric { display:flex; gap:10px; flex-wrap:wrap; }
    .metric > div { background:#eef1f5; border-radius:12px; padding:10px 12px; }
    @media(max-width:650px){ .grid2,.grid3,.qrSheet{grid-template-columns:1fr;} }
    @media print {
      body{background:#fff;}
      main > :not(#qrPanel), #qrPanel .card > :not(.qrSheet){display:none!important;}
      #qrPanel,#qrPanel .card,.qrSheet{display:block!important;box-shadow:none;padding:0;margin:0;}
      .qrSheet{display:grid!important;grid-template-columns:repeat(2,1fr);gap:10mm;}
      .qrCard{border:1px solid #000;page-break-inside:avoid;}
    }
  </style>
</head>
<body>
<main>
  <h1>English QR Reader</h1>

  <div class="tabs">
    <button class="tabBtn active" data-target="readerPanel">読み取り</button>
    <button class="tabBtn" data-target="dataPanel">データ管理</button>
    <button class="tabBtn" data-target="qrPanel">一括QR作成</button>
  </div>

  <section id="readerPanel" class="panel active">
    <div class="card">
      <h2>CSVをIndexedDBへ登録</h2>
      <input id="csvFile" type="file" accept=".csv,text/csv,text/plain">
      <div class="row">
        <button id="replaceImportBtn">全置換で読み込む</button>
        <button id="mergeImportBtn" class="secondary">追加・上書きで読み込む</button>
        <button id="exportBtn" class="secondary">CSVを書き出す</button>
      </div>
      <p id="importStatus" class="status"></p>
      <div class="metric">
        <div>登録件数：<strong id="recordCount">0</strong></div>
        <div>データ版：<strong id="dataVersion">未設定</strong></div>
        <div>保存使用量：<strong id="storageUsage">確認中</strong></div>
      </div>
    </div>

    <div class="card">
      <h2>QRコードを読み取る</h2>
      <div id="reader"></div>
      <div class="row">
        <button id="startBtn">QRコードを読み取る</button>
        <button id="stopBtn" class="secondary" disabled>カメラを止める</button>
      </div>
      <p id="scanStatus" class="status"></p>
    </div>

    <div class="card">
      <span id="idBadge" class="badge">ID：未選択</span>
      <span id="modeBadge" class="badge">読み方：未選択</span>
      <div id="english">CSVを登録してQRコードを読み取ってください</div>
      <div id="japanese"></div>
      <div class="row">
        <button id="playConfiguredBtn">▶ 設定どおり読む</button>
        <button id="playEnglishBtn" class="secondary">英語だけ</button>
        <button id="playJapaneseBtn" class="secondary">日本語だけ</button>
        <button id="playBothBtn" class="secondary">英語→日本語</button>
      </div>
      <div class="grid2" style="margin-top:12px;">
        <label><span>確認用ID</span><input id="manualId" type="text" placeholder="E000001"></label>
        <label><span>英語速度</span>
          <select id="manualEnglishRate">
            <option value="0.6">0.6倍</option><option value="0.8">0.8倍</option>
            <option value="1" selected>1.0倍</option><option value="1.2">1.2倍</option>
            <option value="1.4">1.4倍</option>
          </select>
        </label>
      </div>
      <div class="row"><button id="manualLookupBtn" class="secondary">IDを検索する</button></div>
    </div>
  </section>

  <section id="dataPanel" class="panel">
    <div class="card">
      <h2>データ追加・書き換え</h2>
      <div class="grid2">
        <label><span>ID</span><input id="editId" type="text" placeholder="E000001"></label>
        <label><span>日本語</span><input id="editJapanese" type="text"></label>
      </div>
      <label style="margin-top:10px;"><span>英文</span><textarea id="editEnglish"></textarea></label>
      <div class="grid3" style="margin-top:10px;">
        <label><span>読み方</span>
          <select id="editMode">
            <option value="english">英語のみ</option>
            <option value="japanese">日本語のみ</option>
            <option value="both" selected>英語→日本語</option>
          </select>
        </label>
        <label><span>英語速度</span>
          <select id="editEnglishRate">
            <option value="0.6">0.6</option><option value="0.8">0.8</option>
            <option value="1" selected>1.0</option><option value="1.2">1.2</option>
            <option value="1.4">1.4</option>
          </select>
        </label>
        <label><span>日本語速度</span>
          <select id="editJapaneseRate">
            <option value="0.6">0.6</option><option value="0.8">0.8</option>
            <option value="1" selected>1.0</option><option value="1.2">1.2</option>
            <option value="1.4">1.4</option>
          </select>
        </label>
      </div>
      <div class="grid3" style="margin-top:10px;">
        <label><span>繰り返し回数</span><input id="editRepeat" type="number" min="1" max="10" value="1"></label>
        <label><span>英語→日本語の間隔（秒）</span><input id="editGap" type="number" min="0" max="10" step="0.1" value="0.5"></label>
        <label><span>データ版</span><input id="editVersion" type="text" placeholder="2026-08-01"></label>
      </div>
      <div class="row">
        <button id="saveBtn">追加／上書き</button>
        <button id="clearEditorBtn" class="secondary">入力欄を空にする</button>
      </div>
      <p id="editStatus" class="status"></p>

      <div class="grid2" style="margin-top:14px;">
        <label><span>検索</span><input id="searchText" type="text" placeholder="ID・英文・日本語"></label>
        <label><span>1ページの件数</span>
          <select id="pageSize"><option>25</option><option selected>50</option><option>100</option></select>
        </label>
      </div>
      <div class="row">
        <button id="prevBtn" class="secondary">前のページ</button>
        <button id="nextBtn" class="secondary">次のページ</button>
      </div>
      <p id="pageStatus" class="hint"></p>

      <div class="tableWrap">
        <table>
          <thead><tr><th>選択</th><th>ID</th><th>英文</th><th>日本語</th><th>読み方</th><th>英速</th><th>日速</th><th>回数</th><th>操作</th></tr></thead>
          <tbody id="recordBody"></tbody>
        </table>
      </div>
    </div>
  </section>

  <section id="qrPanel" class="panel">
    <div class="card">
      <h2>一括QRコード作成</h2>
      <div class="grid3">
        <label><span>開始位置</span><input id="qrStart" type="number" min="1" value="1"></label>
        <label><span>件数</span>
          <select id="qrCount"><option>6</option><option>8</option><option selected>10</option><option>12</option></select>
        </label>
        <label><span>検索</span><input id="qrSearch" type="text" placeholder="ID・英文・日本語"></label>
      </div>
      <div class="row">
        <button id="makeSelectedQrBtn">選択したQRを作る</button>
        <button id="makeRangeQrBtn" class="secondary">指定位置から作る</button>
        <button id="printBtn" class="secondary">印刷／PDF保存</button>
      </div>
      <p id="qrStatus" class="status"></p>
      <div id="qrSheet" class="qrSheet"></div>
    </div>
  </section>
</main>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
const DB_NAME = "EnglishQrReaderDB";
const DB_VERSION = 1;
const STORE = "records";
const META = "meta";
const $ = id => document.getElementById(id);

let db;
let scanner = null;
let currentRecord = null;
let currentPage = 0;
let selectedIds = new Set();
let speakingToken = 0;

function setStatus(el, msg, ok=true) {
  el.textContent = msg;
  el.className = "status " + (ok ? "ok" : "error");
}
function modeLabel(mode) {
  return mode === "english" ? "英語のみ" : mode === "japanese" ? "日本語のみ" : "英語→日本語";
}
function openDb() {
  return new Promise((resolve,reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE)) {
        const s = d.createObjectStore(STORE, { keyPath:"id" });
        s.createIndex("english","english",{unique:false});
        s.createIndex("japanese","japanese",{unique:false});
      }
      if (!d.objectStoreNames.contains(META)) d.createObjectStore(META,{keyPath:"key"});
    };
    req.onsuccess = () => { db=req.result; resolve(db); };
    req.onerror = () => reject(req.error);
  });
}
function tx(store, mode="readonly") { return db.transaction(store,mode).objectStore(store); }
function reqPromise(req) {
  return new Promise((resolve,reject)=>{ req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error); });
}
async function putMeta(key,value) { await reqPromise(tx(META,"readwrite").put({key,value})); }
async function getMeta(key) { const r=await reqPromise(tx(META).get(key)); return r?.value; }
async function countRecords() { return await reqPromise(tx(STORE).count()); }
async function getRecord(id) { return await reqPromise(tx(STORE).get(id)); }
async function putRecord(record) { await reqPromise(tx(STORE,"readwrite").put(record)); }
async function deleteRecord(id) { await reqPromise(tx(STORE,"readwrite").delete(id)); }
async function clearRecords() { await reqPromise(tx(STORE,"readwrite").clear()); }
async function getAllRecords() { return await reqPromise(tx(STORE).getAll()); }

function parseCsv(text) {
  const rows=[]; let row=[],cell="",quoted=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(quoted){
      if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else quoted=false; }
      else cell+=ch;
    } else {
      if(ch==='"') quoted=true;
      else if(ch===','){row.push(cell);cell="";}
      else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell="";}
      else if(ch!=='\r') cell+=ch;
    }
  }
  row.push(cell); if(row.some(v=>v!=="")) rows.push(row); return rows;
}
function csvToRecords(rows) {
  if(rows.length<2) throw new Error("CSVにデータ行がありません。");
  const h=rows[0].map(v=>String(v||"").replace(/^\uFEFF/,"").trim().toLowerCase());
  const idx=names=>h.findIndex(x=>names.includes(x));
  const iId=idx(["id"]), iEn=idx(["english","英語","英文"]), iJa=idx(["japanese","日本語","和訳"]);
  const iMode=idx(["mode","読み方"]), iER=idx(["englishrate","english_rate","英語速度"]);
  const iJR=idx(["japaneserate","japanese_rate","日本語速度"]), iRep=idx(["repeat","回数"]);
  const iGap=idx(["gap","間隔"]), iVer=idx(["version","版","データ版"]);
  if(iId<0||iEn<0) throw new Error("ID列とEnglish列が必要です。");
  const out=[]; let version="";
  for(let i=1;i<rows.length;i++){
    const c=rows[i], id=String(c[iId]||"").trim(), english=String(c[iEn]||"").trim();
    if(!id||!english) continue;
    const modeRaw=String(iMode>=0?c[iMode]||"both":"both").trim().toLowerCase();
    const mode=["english","japanese","both"].includes(modeRaw)?modeRaw:"both";
    const rec={id,english,japanese:iJa>=0?String(c[iJa]||"").trim():"",
      mode,englishRate:iER>=0?Number(c[iER])||1:1,japaneseRate:iJR>=0?Number(c[iJR])||1:1,
      repeat:iRep>=0?Math.max(1,parseInt(c[iRep],10)||1):1,
      gap:iGap>=0?Math.max(0,Number(c[iGap])||0):0.5,
      version:iVer>=0?String(c[iVer]||"").trim():""};
    if(rec.version) version=rec.version;
    out.push(rec);
  }
  return {records:out,version};
}
async function importCsv(replace) {
  const file=$("csvFile").files[0];
  if(!file){setStatus($("importStatus"),"CSVを選択してください。",false);return;}
  try{
    const parsed=csvToRecords(parseCsv(await file.text()));
    if(replace) await clearRecords();
    const transaction=db.transaction(STORE,"readwrite");
    const store=transaction.objectStore(STORE);
    parsed.records.forEach(r=>store.put(r));
    await new Promise((resolve,reject)=>{transaction.oncomplete=resolve;transaction.onerror=()=>reject(transaction.error);});
    if(parsed.version) await putMeta("version",parsed.version);
    setStatus($("importStatus"),parsed.records.length+"件を"+(replace?"全置換":"追加・上書き")+"しました。");
    currentPage=0; selectedIds.clear(); await refreshSummary(); await renderPage();
  }catch(e){setStatus($("importStatus"),e.message||"読み込みに失敗しました。",false);}
}
function csvEscape(v){const s=String(v??"");return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
async function exportCsv(){
  const all=(await getAllRecords()).sort((a,b)=>a.id.localeCompare(b.id));
  const lines=["ID,English,Japanese,Mode,EnglishRate,JapaneseRate,Repeat,Gap,Version"];
  all.forEach(r=>lines.push([r.id,r.english,r.japanese,r.mode,r.englishRate,r.japaneseRate,r.repeat,r.gap,r.version||""].map(csvEscape).join(",")));
  const blob=new Blob(["\uFEFF"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="words.csv";a.click();URL.revokeObjectURL(a.href);
}
async function refreshSummary(){
  $("recordCount").textContent=await countRecords();
  $("dataVersion").textContent=(await getMeta("version"))||"未設定";
  if(navigator.storage?.estimate){
    const e=await navigator.storage.estimate();
    const used=((e.usage||0)/1024/1024).toFixed(1);
    const quota=((e.quota||0)/1024/1024).toFixed(0);
    $("storageUsage").textContent=used+" MB / 約"+quota+" MB";
  }else $("storageUsage").textContent="取得不可";
}
function englishVoice(){const v=speechSynthesis.getVoices();return v.find(x=>x.lang==="en-US")||v.find(x=>x.lang.startsWith("en"))||null;}
function japaneseVoice(){const v=speechSynthesis.getVoices();return v.find(x=>x.lang==="ja-JP")||v.find(x=>x.lang.startsWith("ja"))||null;}
function speakText(text,lang,rate){
  return new Promise(resolve=>{
    if(!text){resolve();return;}
    const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=rate;
    const v=lang.startsWith("ja")?japaneseVoice():englishVoice();if(v)u.voice=v;
    u.onend=resolve;u.onerror=resolve;speechSynthesis.speak(u);
  });
}
async function playRecord(modeOverride=null){
  if(!currentRecord)return;
  const token=++speakingToken;speechSynthesis.cancel();
  const mode=modeOverride||currentRecord.mode;
  for(let i=0;i<currentRecord.repeat;i++){
    if(token!==speakingToken)break;
    if(mode==="english") await speakText(currentRecord.english,"en-US",currentRecord.englishRate);
    else if(mode==="japanese") await speakText(currentRecord.japanese,"ja-JP",currentRecord.japaneseRate);
    else{
      await speakText(currentRecord.english,"en-US",currentRecord.englishRate);
      await new Promise(r=>setTimeout(r,(currentRecord.gap||0.5)*1000));
      await speakText(currentRecord.japanese,"ja-JP",currentRecord.japaneseRate);
    }
    if(i<currentRecord.repeat-1)await new Promise(r=>setTimeout(r,450));
  }
}
async function lookup(id,auto=true){
  id=String(id||"").trim();if(!id)return;
  const r=await getRecord(id);
  if(!r){setStatus($("scanStatus"),id+" が見つかりません。",false);return;}
  currentRecord=r;$("idBadge").textContent="ID："+r.id;$("modeBadge").textContent="読み方："+modeLabel(r.mode);
  $("english").textContent=r.english;$("japanese").textContent=r.japanese;
  $("manualEnglishRate").value=String(r.englishRate);
  setStatus($("scanStatus"),id+" を読み取りました。");
  if(auto)playRecord();
}
async function stopScanner(){if(!scanner)return;try{await scanner.stop();await scanner.clear();}catch{}scanner=null;$("startBtn").disabled=false;$("stopBtn").disabled=true;}
async function startScanner(){
  if(typeof Html5Qrcode==="undefined"){setStatus($("scanStatus"),"QR機能を読み込めません。",false);return;}
  await stopScanner();scanner=new Html5Qrcode("reader");$("startBtn").disabled=true;$("stopBtn").disabled=false;
  try{
    await scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:240,height:240}},
      async text=>{await stopScanner();await lookup(text,true);},()=>{});
    setStatus($("scanStatus"),"カメラをQRコードへ向けてください。");
  }catch{setStatus($("scanStatus"),"カメラを開始できません。",false);await stopScanner();}
}
function clearEditor(){
  ["editId","editJapanese","editEnglish","editVersion"].forEach(id=>$(id).value="");
  $("editMode").value="both";$("editEnglishRate").value="1";$("editJapaneseRate").value="1";
  $("editRepeat").value="1";$("editGap").value="0.5";
}
async function saveEditor(){
  const id=$("editId").value.trim(),english=$("editEnglish").value.trim();
  if(!id||!english){setStatus($("editStatus"),"IDと英文は必須です。",false);return;}
  const r={id,english,japanese:$("editJapanese").value.trim(),mode:$("editMode").value,
    englishRate:Number($("editEnglishRate").value)||1,japaneseRate:Number($("editJapaneseRate").value)||1,
    repeat:Math.max(1,parseInt($("editRepeat").value,10)||1),gap:Math.max(0,Number($("editGap").value)||0),
    version:$("editVersion").value.trim()};
  await putRecord(r);if(r.version)await putMeta("version",r.version);
  setStatus($("editStatus"),id+" を保存しました。");await refreshSummary();await renderPage();
}
async function editRecord(id){
  const r=await getRecord(id);if(!r)return;
  $("editId").value=r.id;$("editEnglish").value=r.english;$("editJapanese").value=r.japanese;
  $("editMode").value=r.mode;$("editEnglishRate").value=String(r.englishRate);
  $("editJapaneseRate").value=String(r.japaneseRate);$("editRepeat").value=String(r.repeat);
  $("editGap").value=String(r.gap);$("editVersion").value=r.version||"";
}
async function filteredAll(searchId){
  const q=$(searchId).value.trim().toLowerCase();
  const all=await getAllRecords();
  return all.sort((a,b)=>a.id.localeCompare(b.id)).filter(r=>!q||[r.id,r.english,r.japanese].some(v=>String(v).toLowerCase().includes(q)));
}
async function renderPage(){
  const all=await filteredAll("searchText"),size=Number($("pageSize").value),start=currentPage*size;
  const page=all.slice(start,start+size),body=$("recordBody");body.innerHTML="";
  page.forEach(r=>{
    const tr=document.createElement("tr");
    const sel=document.createElement("td"),cb=document.createElement("input");cb.type="checkbox";cb.checked=selectedIds.has(r.id);
    cb.addEventListener("change",()=>cb.checked?selectedIds.add(r.id):selectedIds.delete(r.id));sel.appendChild(cb);tr.appendChild(sel);
    [r.id,r.english,r.japanese,modeLabel(r.mode),r.englishRate,r.japaneseRate,r.repeat].forEach(v=>{const td=document.createElement("td");td.textContent=v;tr.appendChild(td);});
    const act=document.createElement("td"),e=document.createElement("button"),d=document.createElement("button");
    e.textContent="編集";e.className="smallBtn secondary";e.addEventListener("click",()=>editRecord(r.id));
    d.textContent="削除";d.className="smallBtn danger";d.style.marginLeft="6px";d.addEventListener("click",async()=>{if(confirm(r.id+"を削除しますか？")){await deleteRecord(r.id);selectedIds.delete(r.id);await refreshSummary();await renderPage();}});
    act.append(e,d);tr.appendChild(act);body.appendChild(tr);
  });
  $("pageStatus").textContent=all.length?`${start+1}～${Math.min(start+size,all.length)} / ${all.length}件`:"0件";
  $("prevBtn").disabled=currentPage===0;$("nextBtn").disabled=start+size>=all.length;
}
function renderQr(records){
  const sheet=$("qrSheet");sheet.innerHTML="";
  records.forEach(r=>{
    const card=document.createElement("div");card.className="qrCard";
    const q=document.createElement("div");card.appendChild(q);
    new QRCode(q,{text:r.id,width:150,height:150,correctLevel:QRCode.CorrectLevel.M});
    for(const [cls,text] of [["qrId",r.id],["qrEnglish",r.english],["qrJapanese",r.japanese]]){
      const d=document.createElement("div");d.className=cls;d.textContent=text;card.appendChild(d);
    }
    sheet.appendChild(card);
  });
  setStatus($("qrStatus"),records.length+"件作成しました。");
}

document.querySelectorAll(".tabBtn").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".tabBtn").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");$(b.dataset.target).classList.add("active");
}));
$("replaceImportBtn").addEventListener("click",()=>importCsv(true));
$("mergeImportBtn").addEventListener("click",()=>importCsv(false));
$("exportBtn").addEventListener("click",exportCsv);
$("startBtn").addEventListener("click",startScanner);$("stopBtn").addEventListener("click",stopScanner);
$("manualLookupBtn").addEventListener("click",()=>lookup($("manualId").value,false));
$("playConfiguredBtn").addEventListener("click",()=>playRecord());
$("playEnglishBtn").addEventListener("click",()=>playRecord("english"));
$("playJapaneseBtn").addEventListener("click",()=>playRecord("japanese"));
$("playBothBtn").addEventListener("click",()=>playRecord("both"));
$("manualEnglishRate").addEventListener("change",()=>{if(currentRecord)currentRecord.englishRate=Number($("manualEnglishRate").value);});
$("saveBtn").addEventListener("click",saveEditor);$("clearEditorBtn").addEventListener("click",clearEditor);
$("searchText").addEventListener("input",()=>{currentPage=0;renderPage();});
$("pageSize").addEventListener("change",()=>{currentPage=0;renderPage();});
$("prevBtn").addEventListener("click",()=>{if(currentPage>0){currentPage--;renderPage();}});
$("nextBtn").addEventListener("click",()=>{currentPage++;renderPage();});
$("makeSelectedQrBtn").addEventListener("click",async()=>{
  const all=await getAllRecords(),list=all.filter(r=>selectedIds.has(r.id)).sort((a,b)=>a.id.localeCompare(b.id));
  if(!list.length){setStatus($("qrStatus"),"データ管理画面で選択してください。",false);return;}renderQr(list);
});
$("makeRangeQrBtn").addEventListener("click",async()=>{
  const all=await filteredAll("qrSearch"),start=Math.max(1,Number($("qrStart").value)||1)-1,count=Number($("qrCount").value)||10;
  renderQr(all.slice(start,start+count));
});
$("printBtn").addEventListener("click",()=>window.print());

(async()=>{
  await openDb();await refreshSummary();await renderPage();
  if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
})();
</script>
</body>
</html>
