<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>English QR Reader</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f5f6f8; color: #111; }
    main { max-width: 920px; margin: 0 auto; padding: 18px; }
    h1 { font-size: 1.7rem; margin: 4px 0 16px; }
    h2 { font-size: 1.15rem; margin-top: 0; }
    .card { background: #fff; border-radius: 18px; padding: 18px; margin-bottom: 16px;
            box-shadow: 0 4px 18px rgba(0,0,0,.07); }
    #reader { width: 100%; overflow: hidden; border-radius: 14px; }
    button, select, input[type="file"], input[type="text"], input[type="number"], textarea {
      font: inherit; border-radius: 12px; border: 1px solid #c9cdd4; box-sizing: border-box;
    }
    button { padding: 12px 14px; background: #111; color: #fff; border: 0; font-weight: 700; }
    button.secondary { background: #e9edf3; color: #111; }
    button.danger { background: #8b1e1e; }
    button:disabled { opacity: .5; }
    input[type="file"], input[type="text"], input[type="number"], textarea {
      width: 100%; padding: 11px; background: #fff;
    }
    textarea { min-height: 84px; resize: vertical; }
    select { width: 100%; padding: 10px; background: #fff; }
    label { display: block; font-weight: 650; }
    label span { display: block; margin-bottom: 5px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    .row > * { flex: 1 1 140px; }
    #english { font-size: clamp(1.8rem, 7vw, 3.4rem); font-weight: 800; line-height: 1.2;
               overflow-wrap: anywhere; margin: 8px 0; }
    #japanese { font-size: 1.15rem; color: #555; margin-top: 10px; }
    .hint { color: #666; font-size: .92rem; line-height: 1.55; }
    .status { min-height: 1.4em; font-weight: 600; }
    .ok { color: #285; }
    .error { color: #a21b1b; }
    .badge { display: inline-block; padding: 5px 9px; border-radius: 999px; background: #e9edf3;
             font-size: .85rem; margin-bottom: 8px; }
    .tableWrap { overflow-x: auto; margin-top: 12px; }
    table { width: 100%; border-collapse: collapse; min-width: 760px; }
    th, td { border-bottom: 1px solid #ddd; padding: 9px 7px; text-align: left; vertical-align: top; }
    th { background: #f1f3f6; }
    .smallBtn { padding: 7px 9px; font-size: .88rem; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .tabBtn { background: #e9edf3; color: #111; }
    .tabBtn.active { background: #111; color: #fff; }
    .tabPanel { display: none; }
    .tabPanel.active { display: block; }
    .qrSheet { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 16px; }
    .qrCard { border: 1px solid #ccc; border-radius: 14px; padding: 12px; text-align: center; break-inside: avoid; }
    .qrCard canvas, .qrCard img { width: 150px !important; height: 150px !important; }
    .qrId { font-weight: 800; margin-top: 8px; }
    .qrEnglish { font-size: .95rem; margin-top: 4px; }
    .qrJapanese { font-size: .85rem; color: #555; margin-top: 2px; }
    .checkbox { transform: scale(1.25); }
    @media (max-width: 620px) {
      .grid, .grid3 { grid-template-columns: 1fr; }
      .qrSheet { grid-template-columns: 1fr; }
    }
    @media print {
      body { background: #fff; }
      main > :not(#batchTab), #batchTab .card > :not(.qrSheet) { display: none !important; }
      #batchTab, #batchTab .card, .qrSheet { display: block !important; box-shadow: none; padding: 0; margin: 0; }
      .qrSheet { display: grid !important; grid-template-columns: repeat(2, 1fr); gap: 10mm; }
      .qrCard { border: 1px solid #000; page-break-inside: avoid; }
    }
  </style>
</head>
<body>
<main>
  <h1>English QR Reader</h1>

  <div class="tabs">
    <button class="tabBtn active" data-tab="readerTab">読み取り</button>
    <button class="tabBtn" data-tab="dataTab">英文データ編集</button>
    <button class="tabBtn" data-tab="batchTab">一括QR作成</button>
  </div>

  <section id="readerTab" class="tabPanel active">
    <section class="card">
      <h2>1．iCloud DriveのCSVを登録</h2>
      <input id="csvFile" type="file" accept=".csv,text/csv,text/plain">
      <div class="row">
        <button id="importBtn">CSVを読み込む</button>
        <button id="exportBtn" class="secondary">CSVを書き出す</button>
        <button id="clearBtn" class="danger">登録データを消す</button>
      </div>
      <p id="csvStatus" class="status"></p>
    </section>

    <section class="card">
      <h2>2．QRコードを読み取る</h2>
      <div id="reader"></div>
      <div class="row">
        <button id="startBtn">QRコードを読み取る</button>
        <button id="stopBtn" class="secondary" disabled>カメラを止める</button>
      </div>
      <p id="scanStatus" class="status"></p>
    </section>

    <section class="card">
      <span id="idBadge" class="badge">ID：未選択</span>
      <div id="english">CSVを登録してQRコードを読み取ってください</div>
      <div id="japanese"></div>
      <div class="row">
        <button id="speakBtn">▶ 読む</button>
        <button id="repeatBtn" class="secondary">🔁 指定回数読む</button>
      </div>
      <div class="grid" style="margin-top:12px;">
        <label><span>読む速さ</span>
          <select id="rate">
            <option value="0.6">0.6倍</option>
            <option value="0.8">0.8倍</option>
            <option value="1" selected>1.0倍</option>
            <option value="1.2">1.2倍</option>
            <option value="1.4">1.4倍</option>
          </select>
        </label>
        <label><span>確認用ID</span><input id="manualId" type="text" placeholder="E000001"></label>
      </div>
      <div class="row">
        <button id="manualBtn" class="secondary">IDを検索する</button>
      </div>
    </section>
  </section>

  <section id="dataTab" class="tabPanel">
    <section class="card">
      <h2>英文データを追加・書き換え</h2>
      <p class="hint">同じIDなら上書き、新しいIDなら追加です。保存後はCSVを書き出してバックアップしてください。</p>
      <div class="grid">
        <label><span>ID</span><input id="editId" type="text" placeholder="E000001"></label>
        <label><span>日本語</span><input id="editJapanese" type="text"></label>
      </div>
      <label style="margin-top:10px;"><span>英文</span><textarea id="editEnglish"></textarea></label>
      <div class="grid3" style="margin-top:10px;">
        <label><span>速度</span>
          <select id="editRate">
            <option value="0.6">0.6</option><option value="0.8">0.8</option>
            <option value="1" selected>1.0</option><option value="1.2">1.2</option><option value="1.4">1.4</option>
          </select>
        </label>
        <label><span>回数</span><input id="editRepeat" type="number" min="1" max="10" value="1"></label>
        <label><span>検索</span><input id="filterText" type="text" placeholder="ID・英文・日本語"></label>
      </div>
      <div class="row">
        <button id="saveRecordBtn">追加／上書き</button>
        <button id="newRecordBtn" class="secondary">入力欄を空にする</button>
      </div>
      <p id="editStatus" class="status"></p>

      <div class="tableWrap">
        <table>
          <thead><tr><th>選択</th><th>ID</th><th>英文</th><th>日本語</th><th>速度</th><th>回数</th><th>操作</th></tr></thead>
          <tbody id="recordBody"></tbody>
        </table>
      </div>
    </section>
  </section>

  <section id="batchTab" class="tabPanel">
    <section class="card">
      <h2>一括QRコード作成</h2>
      <p class="hint">
        英文データ一覧で選択したIDから、10件ずつQRカードを作ります。
        QRカードにはID、英文、日本語を一緒に表示できます。
      </p>
      <div class="grid3">
        <label><span>1ページの件数</span>
          <select id="batchSize">
            <option value="6">6件</option>
            <option value="8">8件</option>
            <option value="10" selected>10件</option>
            <option value="12">12件</option>
          </select>
        </label>
        <label><span>開始位置</span><input id="batchStart" type="number" min="1" value="1"></label>
        <label><span>検索</span><input id="batchFilter" type="text" placeholder="ID・英文・日本語"></label>
      </div>
      <div class="row">
        <button id="selectFirstBtn" class="secondary">表示中の先頭10件を選択</button>
        <button id="selectAllBtn" class="secondary">表示中をすべて選択</button>
        <button id="clearSelectionBtn" class="secondary">選択解除</button>
      </div>
      <div class="row">
        <button id="makeBatchBtn">選択したQRを作る</button>
        <button id="makePageBtn" class="secondary">指定位置から10件作る</button>
        <button id="printBtn" class="secondary">印刷／PDF保存</button>
      </div>
      <p id="batchStatus" class="status"></p>
      <div id="qrSheet" class="qrSheet"></div>
    </section>
  </section>
</main>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
  const STORAGE_KEY = "englishQrReaderCsvDataV4";
  const $ = id => document.getElementById(id);
  let records = {};
  let selectedIds = new Set();
  let scanner = null;
  let currentRecord = null;
  let speakingToken = 0;

  function setStatus(el, msg, ok=true) {
    el.textContent = msg;
    el.className = "status " + (ok ? "ok" : "error");
  }
  function norm(v) { return String(v || "").replace(/^\uFEFF/, "").trim().toLowerCase(); }
  function parseCsv(text) {
    const rows=[]; let row=[], cell="", quoted=false;
    for (let i=0;i<text.length;i++) {
      const ch=text[i];
      if (quoted) {
        if (ch === '"') {
          if (text[i+1] === '"') { cell+='"'; i++; } else quoted=false;
        } else cell+=ch;
      } else {
        if (ch === '"') quoted=true;
        else if (ch === ",") { row.push(cell); cell=""; }
        else if (ch === "\n") { row.push(cell); rows.push(row); row=[]; cell=""; }
        else if (ch !== "\r") cell+=ch;
      }
    }
    row.push(cell); if (row.some(v=>v!=="")) rows.push(row); return rows;
  }
  function rowsToRecords(rows) {
    if (rows.length < 2) throw new Error("CSVにデータ行がありません。");
    const h=rows[0].map(norm), idx=names=>h.findIndex(x=>names.includes(x));
    const iId=idx(["id"]), iEn=idx(["english","英語","英文"]), iJa=idx(["japanese","日本語","和訳"]),
          iRate=idx(["rate","速度"]), iRep=idx(["repeat","回数"]);
    if (iId<0 || iEn<0) throw new Error("ID列とEnglish列が必要です。");
    const out={};
    for (let i=1;i<rows.length;i++) {
      const c=rows[i], id=String(c[iId]||"").trim(), en=String(c[iEn]||"").trim();
      if (!id || !en) continue;
      out[id]={id, english:en, japanese:iJa>=0?String(c[iJa]||"").trim():"",
        rate:iRate>=0?Number(c[iRate])||1:1, repeat:iRep>=0?Math.max(1,parseInt(c[iRep],10)||1):1};
    }
    return out;
  }
  function saveRecords() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    renderTable();
  }
  function loadRecords() {
    try { records=JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}"); } catch { records={}; }
    const n=Object.keys(records).length;
    if (n) setStatus($("csvStatus"), n+"件のデータが端末内に登録されています。");
    renderTable();
  }
  function esc(v) {
    const s=String(v??""); return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
  }
  function exportCsv() {
    const lines=["ID,English,Japanese,Rate,Repeat"];
    Object.values(records).sort((a,b)=>a.id.localeCompare(b.id)).forEach(r=>{
      lines.push([r.id,r.english,r.japanese,r.rate,r.repeat].map(esc).join(","));
    });
    const blob=new Blob(["\uFEFF"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="words.csv"; a.click();
    URL.revokeObjectURL(a.href); setStatus($("csvStatus"),"words.csvを書き出しました。");
  }
  function showRecord(r) {
    currentRecord=r; $("idBadge").textContent="ID："+r.id; $("english").textContent=r.english;
    $("japanese").textContent=r.japanese; $("rate").value=String(r.rate);
  }
  function lookupId(id, auto=true) {
    id=String(id||"").trim(); if (!id) return;
    const r=records[id];
    if (!r) { setStatus($("scanStatus"),id+" が見つかりません。",false); return; }
    showRecord(r); setStatus($("scanStatus"),id+" を読み取りました。"); if (auto) speak(r.repeat);
  }
  function voice() {
    const vs=speechSynthesis.getVoices();
    return vs.find(v=>v.lang==="en-US")||vs.find(v=>v.lang.startsWith("en"))||null;
  }
  function speakOnce(text) {
    return new Promise(resolve=>{
      const u=new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate=Number($("rate").value);
      const v=voice(); if (v) u.voice=v; u.onend=resolve; u.onerror=resolve; speechSynthesis.speak(u);
    });
  }
  async function speak(n=1) {
    if (!currentRecord) return; const token=++speakingToken; speechSynthesis.cancel();
    for (let i=0;i<n;i++) { if (token!==speakingToken) break; await speakOnce(currentRecord.english);
      if (i<n-1) await new Promise(r=>setTimeout(r,450)); }
  }
  async function stopScanner() {
    if (!scanner) return; try { await scanner.stop(); await scanner.clear(); } catch {}
    scanner=null; $("startBtn").disabled=false; $("stopBtn").disabled=true;
  }
  async function startScanner() {
    if (!Object.keys(records).length) { setStatus($("scanStatus"),"先にCSVを登録してください。",false); return; }
    await stopScanner(); scanner=new Html5Qrcode("reader"); $("startBtn").disabled=true; $("stopBtn").disabled=false;
    try {
      await scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:240,height:240}},
        async text=>{ await stopScanner(); lookupId(text,true); },()=>{});
      setStatus($("scanStatus"),"カメラをQRコードに向けてください。");
    } catch { setStatus($("scanStatus"),"カメラを開始できません。",false); await stopScanner(); }
  }
  function clearEditor() {
    ["editId","editEnglish","editJapanese"].forEach(id=>$(id).value="");
    $("editRate").value="1"; $("editRepeat").value="1";
  }
  function saveEditedRecord() {
    const id=$("editId").value.trim(), en=$("editEnglish").value.trim();
    if (!id||!en) { setStatus($("editStatus"),"IDと英文は必須です。",false); return; }
    records[id]={id,english:en,japanese:$("editJapanese").value.trim(),
      rate:Number($("editRate").value)||1,repeat:Math.max(1,parseInt($("editRepeat").value,10)||1)};
    saveRecords(); setStatus($("editStatus"),id+" を保存しました。");
  }
  function editRecord(id) {
    const r=records[id]; $("editId").value=r.id; $("editEnglish").value=r.english;
    $("editJapanese").value=r.japanese; $("editRate").value=String(r.rate); $("editRepeat").value=String(r.repeat);
  }
  function deleteRecord(id) {
    if (!confirm(id+" を削除しますか？")) return;
    delete records[id]; selectedIds.delete(id); saveRecords();
  }
  function filteredRecords(filterId) {
    const q=$(filterId).value.trim().toLowerCase();
    return Object.values(records).sort((a,b)=>a.id.localeCompare(b.id))
      .filter(r=>!q||[r.id,r.english,r.japanese].some(v=>String(v).toLowerCase().includes(q)));
  }
  function renderTable() {
    const body=$("recordBody"); body.innerHTML="";
    filteredRecords("filterText").forEach(r=>{
      const tr=document.createElement("tr");
      const sel=document.createElement("td"), cb=document.createElement("input");
      cb.type="checkbox"; cb.className="checkbox"; cb.checked=selectedIds.has(r.id);
      cb.addEventListener("change",()=>{ cb.checked?selectedIds.add(r.id):selectedIds.delete(r.id); });
      sel.appendChild(cb); tr.appendChild(sel);
      [r.id,r.english,r.japanese,r.rate,r.repeat].forEach(v=>{ const td=document.createElement("td"); td.textContent=v; tr.appendChild(td); });
      const td=document.createElement("td");
      const e=document.createElement("button"); e.textContent="編集"; e.className="smallBtn secondary"; e.addEventListener("click",()=>editRecord(r.id));
      const d=document.createElement("button"); d.textContent="削除"; d.className="smallBtn danger"; d.style.marginLeft="6px"; d.addEventListener("click",()=>deleteRecord(r.id));
      td.append(e,d); tr.appendChild(td); body.appendChild(tr);
    });
  }
  function renderQrCards(list) {
    const sheet=$("qrSheet"); sheet.innerHTML="";
    list.forEach(r=>{
      const card=document.createElement("div"); card.className="qrCard";
      const qr=document.createElement("div"); card.appendChild(qr);
      new QRCode(qr,{text:r.id,width:150,height:150,correctLevel:QRCode.CorrectLevel.M});
      const id=document.createElement("div"); id.className="qrId"; id.textContent=r.id;
      const en=document.createElement("div"); en.className="qrEnglish"; en.textContent=r.english;
      const ja=document.createElement("div"); ja.className="qrJapanese"; ja.textContent=r.japanese;
      card.append(id,en,ja); sheet.appendChild(card);
    });
    setStatus($("batchStatus"),list.length+"件のQRコードを作成しました。");
  }

  document.querySelectorAll(".tabBtn").forEach(btn=>btn.addEventListener("click",()=>{
    document.querySelectorAll(".tabBtn").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".tabPanel").forEach(p=>p.classList.remove("active"));
    btn.classList.add("active"); $(btn.dataset.tab).classList.add("active");
  }));
  $("importBtn").addEventListener("click",async()=>{
    const f=$("csvFile").files[0]; if(!f){setStatus($("csvStatus"),"CSVを選択してください。",false);return;}
    try{records=rowsToRecords(parseCsv(await f.text()));selectedIds.clear();saveRecords();
      setStatus($("csvStatus"),Object.keys(records).length+"件を登録しました。");}
    catch(e){setStatus($("csvStatus"),e.message,false);}
  });
  $("exportBtn").addEventListener("click",exportCsv);
  $("clearBtn").addEventListener("click",()=>{if(confirm("すべて削除しますか？")){records={};selectedIds.clear();saveRecords();}});
  $("startBtn").addEventListener("click",startScanner); $("stopBtn").addEventListener("click",stopScanner);
  $("speakBtn").addEventListener("click",()=>speak(1)); $("repeatBtn").addEventListener("click",()=>speak(currentRecord?currentRecord.repeat:1));
  $("manualBtn").addEventListener("click",()=>lookupId($("manualId").value,false));
  $("saveRecordBtn").addEventListener("click",saveEditedRecord); $("newRecordBtn").addEventListener("click",clearEditor);
  $("filterText").addEventListener("input",renderTable);

  $("selectFirstBtn").addEventListener("click",()=>{
    selectedIds.clear(); filteredRecords("batchFilter").slice(0,Number($("batchSize").value)).forEach(r=>selectedIds.add(r.id));
    renderTable(); setStatus($("batchStatus"),selectedIds.size+"件を選択しました。");
  });
  $("selectAllBtn").addEventListener("click",()=>{
    selectedIds.clear(); filteredRecords("batchFilter").forEach(r=>selectedIds.add(r.id));
    renderTable(); setStatus($("batchStatus"),selectedIds.size+"件を選択しました。");
  });
  $("clearSelectionBtn").addEventListener("click",()=>{selectedIds.clear();renderTable();setStatus($("batchStatus"),"選択を解除しました。");});
  $("makeBatchBtn").addEventListener("click",()=>{
    const list=Object.values(records).filter(r=>selectedIds.has(r.id)).sort((a,b)=>a.id.localeCompare(b.id));
    if(!list.length){setStatus($("batchStatus"),"先に英文データ一覧で選択してください。",false);return;}
    renderQrCards(list);
  });
  $("makePageBtn").addEventListener("click",()=>{
    const all=filteredRecords("batchFilter"), start=Math.max(1,Number($("batchStart").value)||1)-1,
      size=Number($("batchSize").value)||10, list=all.slice(start,start+size);
    if(!list.length){setStatus($("batchStatus"),"対象データがありません。",false);return;}
    renderQrCards(list);
  });
  $("printBtn").addEventListener("click",()=>window.print());

  if ("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
  loadRecords();
</script>
</body>
</html>
