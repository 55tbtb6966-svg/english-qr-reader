<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>English QR Reader</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f5f6f8; color: #111; }
    main { max-width: 680px; margin: 0 auto; padding: 20px; }
    h1 { font-size: 1.7rem; margin: 6px 0 16px; }
    .card { background: white; border-radius: 18px; padding: 18px; margin-bottom: 16px;
            box-shadow: 0 4px 18px rgba(0,0,0,.07); }
    #reader { width: 100%; overflow: hidden; border-radius: 14px; }
    button, select, textarea {
      font: inherit; border-radius: 12px; border: 1px solid #c9cdd4;
    }
    button { padding: 13px 16px; background: #111; color: white; border: 0; font-weight: 700; }
    button.secondary { background: #e9edf3; color: #111; }
    button:disabled { opacity: .5; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    .row > * { flex: 1 1 130px; }
    textarea { width: 100%; box-sizing: border-box; min-height: 90px; padding: 12px; }
    select { padding: 10px; background: white; }
    #english { font-size: clamp(1.8rem, 7vw, 3.4rem); font-weight: 800; line-height: 1.2;
               overflow-wrap: anywhere; margin: 8px 0; }
    #japanese { font-size: 1.15rem; color: #555; margin-top: 10px; }
    .hint { color: #666; font-size: .92rem; line-height: 1.55; }
    .status { min-height: 1.4em; color: #285; font-weight: 600; }
  </style>
</head>
<body>
<main>
  <h1>English QR Reader</h1>

  <section class="card">
    <div id="reader"></div>
    <div class="row">
      <button id="startBtn">QRコードを読み取る</button>
      <button id="stopBtn" class="secondary" disabled>カメラを止める</button>
    </div>
    <p id="status" class="status"></p>
    <p class="hint">
      QRコードには <b>英語</b>、または <b>英語|日本語</b> の形式で文字を入れてください。<br>
      例：<code>This is an apple.|これはリンゴです。</code>
    </p>
  </section>

  <section class="card">
    <div id="english">QRコードを読み取ってください</div>
    <div id="japanese"></div>

    <div class="row">
      <button id="speakBtn">▶ 読む</button>
      <button id="repeatBtn" class="secondary">🔁 3回読む</button>
    </div>

    <div class="row">
      <label>
        読む速さ
        <select id="rate">
          <option value="0.6">ゆっくり 0.6</option>
          <option value="0.8" selected>少しゆっくり 0.8</option>
          <option value="1">ふつう 1.0</option>
        </select>
      </label>
    </div>
  </section>

  <section class="card">
    <label for="manual">Windowsでの動作確認用</label>
    <textarea id="manual" placeholder="This is an apple.|これはリンゴです。"></textarea>
    <div class="row">
      <button id="manualBtn" class="secondary">この文章を表示して読む</button>
    </div>
  </section>
</main>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  const englishEl = document.getElementById("english");
  const japaneseEl = document.getElementById("japanese");
  const statusEl = document.getElementById("status");
  const startBtn = document.getElementById("startBtn");
  const stopBtn = document.getElementById("stopBtn");
  const rateEl = document.getElementById("rate");

  let scanner = null;
  let currentEnglish = "";
  let speakingToken = 0;

  function setContent(raw) {
    const text = String(raw || "").trim();
    if (!text) return;
    const divider = text.indexOf("|");
    currentEnglish = divider >= 0 ? text.slice(0, divider).trim() : text;
    const japanese = divider >= 0 ? text.slice(divider + 1).trim() : "";
    englishEl.textContent = currentEnglish || "英文がありません";
    japaneseEl.textContent = japanese;
    statusEl.textContent = "読み取りました。";
  }

  function getEnglishVoice() {
    const voices = window.speechSynthesis.getVoices();
    return voices.find(v => v.lang === "en-US")
      || voices.find(v => v.lang.startsWith("en"))
      || null;
  }

  function speakOnce(text) {
    return new Promise(resolve => {
      if (!("speechSynthesis" in window) || !text) {
        statusEl.textContent = "この端末では読み上げ機能を利用できません。";
        resolve();
        return;
      }
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "en-US";
      utterance.rate = Number(rateEl.value);
      const voice = getEnglishVoice();
      if (voice) utterance.voice = voice;
      utterance.onend = resolve;
      utterance.onerror = resolve;
      window.speechSynthesis.speak(utterance);
    });
  }

  async function speak(repeats = 1) {
    const text = currentEnglish.trim();
    if (!text) return;
    const token = ++speakingToken;
    window.speechSynthesis.cancel();
    for (let i = 0; i < repeats; i++) {
      if (token !== speakingToken) break;
      await speakOnce(text);
      if (i < repeats - 1) await new Promise(r => setTimeout(r, 450));
    }
  }

  async function stopScanner() {
    if (!scanner) return;
    try {
      await scanner.stop();
      await scanner.clear();
    } catch (_) {}
    scanner = null;
    startBtn.disabled = false;
    stopBtn.disabled = true;
  }

  async function startScanner() {
    statusEl.textContent = "";
    if (!window.isSecureContext) {
      statusEl.textContent = "カメラはHTTPSで公開したページから利用してください。";
      return;
    }
    if (typeof Html5Qrcode === "undefined") {
      statusEl.textContent = "QR読み取りライブラリを読み込めませんでした。通信状態を確認してください。";
      return;
    }

    await stopScanner();
    scanner = new Html5Qrcode("reader");
    startBtn.disabled = true;
    stopBtn.disabled = false;

    try {
      await scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 240, height: 240 } },
        async decodedText => {
          setContent(decodedText);
          await stopScanner();
          speak(1);
        },
        () => {}
      );
      statusEl.textContent = "カメラをQRコードに向けてください。";
    } catch (err) {
      statusEl.textContent = "カメラを開始できません。Safariのカメラ許可を確認してください。";
      await stopScanner();
    }
  }

  startBtn.addEventListener("click", startScanner);
  stopBtn.addEventListener("click", stopScanner);
  document.getElementById("speakBtn").addEventListener("click", () => speak(1));
  document.getElementById("repeatBtn").addEventListener("click", () => speak(3));
  document.getElementById("manualBtn").addEventListener("click", () => {
    setContent(document.getElementById("manual").value);
    speak(1);
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
  }
</script>
</body>
</html>
